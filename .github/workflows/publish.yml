# Prepared provenance workflow. It is intentionally manual and confirmation-gated.
# Do not dispatch it until every item in PUBLISHING.md is complete and an authorized
# maintainer has approved the external npm publication.
name: Publish with npm provenance

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type PUBLISH n8n-nodes-pipsync to authorize this npm release'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish approved package
    if: >-
      github.repository == 'pipsyncio/n8n-nodes-pipsync' &&
      github.ref == 'refs/heads/main' &&
      inputs.confirmation == 'PUBLISH n8n-nodes-pipsync'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm-publish

    steps:
      - name: Check out approved release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.0'
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - name: Install npm with trusted-publishing support
        run: npm install --global npm@11.8.0

      - name: Install dependencies from lockfile
        run: npm ci --ignore-scripts

      - name: Verify release candidate
        run: npm run verify

      - name: Publish with GitHub Actions provenance
        run: npm run release
